name: Deploy Firebase Functions

on:
  push:
    branches:
      - main  # El flujo se activará automáticamente cada vez que hagas push o commit en la rama main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código de tu repositorio
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 2. Configurar el entorno de Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18 # Es la versión estándar y recomendada para Cloud Functions actuales

      # 3. Instalar las dependencias de Node.js ESPECÍFICAMENTE dentro de la carpeta 'functions'
      - name: Install Functions Dependencies
        run: npm install  # <-- Cambiado de 'npm ci' a 'npm install'
        working-directory: ./functions

      # 4. Desplegar en Firebase utilizando la cuenta de servicio configurada en los secretos
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
