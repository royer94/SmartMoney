name: Deploy Firebase Functions

on:
  push:
    branches:
      - main  # El flujo se activará automáticamente cada vez que hagas push o commit en la rama main
    paths:
      - 'functions/**' # 👈 ¡Ajuste añadido! El flujo solo se dispara si cambia algo dentro de la carpeta de backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código de tu repositorio
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 2. Configurar el entorno de Node.js (Actualizado a la versión 22 compatible con los entornos modernos de GCP)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Instalar las dependencias de Node.js ESPECÍFICAMENTE dentro de la carpeta 'functions'
      - name: Install Functions Dependencies
        run: npm install
        working-directory: ./functions

      # 4. Desplegar en Firebase utilizando la cuenta de servicio configurada en los secretos
      # Se agrega la bandera --force para evitar que las alertas de políticas de limpieza rompan el flujo de GitHub Actions
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions --force
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
