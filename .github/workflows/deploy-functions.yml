name: Deploy Firebase Functions & Rules
on:
  push:
    branches:
      - main  # El flujo se activará automáticamente cada vez que hagas push o commit en la rama main
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/deploy-functions.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # 1. Descargar el código de tu repositorio
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 2. Configurar el entorno de Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Instalar las dependencias de Node.js dentro de la carpeta 'functions'
      - name: Install Functions Dependencies
        run: npm install
        working-directory: ./functions

      # 4. Autenticar con Google Cloud usando la service account (método oficial)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 5. Desplegar Reglas de Firestore
      - name: Deploy Firestore Rules
        run: npx firebase-tools deploy --only firestore:rules --project gen-lang-client-0987361888 --force

      # 6. Desplegar Cloud Functions
      - name: Deploy Firebase Functions
        run: npx firebase-tools deploy --only functions --project gen-lang-client-0987361888 --force
